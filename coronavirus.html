		<text transform="matrix(1 0 0 1 1808.188 -313.6989)"><tspan x="0" y="0" class="st3 st5" style="font-family:Hiragino6,sans-serif;">2020年初頭、新型コロナウイルスが中国で流行しました。一般的な</tspan><tspan x="0" y="21" class="st3 st5" style="font-family:Hiragino6,sans-serif;">風邪の症状と似ているため、自分が感染している可能性があるか不安</tspan><tspan x="0" y="42.01" class="st3 st5" style="font-family:Hiragino6,sans-serif;">を感じる人も多くいました。そこで、本アプリでは簡単な自己診断テ</tspan><tspan x="0" y="63.01" class="st3 st5" style="font-family:Hiragino6,sans-serif;">ストを通して感染リスクを確認できるようにし、あわせて新型コロナ</tspan><tspan x="0" y="84.02" class="st3 st5" style="font-family:Hiragino6,sans-serif;">ウイルスに関する最新情報も確認できるようにしました。</tspan></text>
