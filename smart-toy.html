		<text transform="matrix(1 0 0 1 69.5792 255.7806)"><tspan x="0" y="0" class="st3 st42 st43">おもちゃは子どもの成長過程において重要な役割を果たします。子どもは遊びを通して未知のものを発見し、学びを深めていきます。</tspan><tspan x="0" y="22.18" class="st3 st42 st43">そのため、おもちゃは子どもにとって欠かせない存在です。</tspan><tspan x="0" y="44.36" class="st3 st42 st43">しかし、成長に伴い使われなくなったおもちゃは放置されたり廃棄されたりすることが多く、保護者にとっても収納や管理が課題とな</tspan><tspan x="0" y="66.55" class="st3 st42 st43">っています。また、現在のおもちゃの多くにはプラスチック素材が使用されており、廃棄時には環境への負荷が問題となる場合があり</tspan><tspan x="0" y="88.73" class="st3 st42 st43">ます。</tspan><tspan x="0" y="110.91" class="st3 st42 st43">そこで、本デザインでは子どもの成長を支えながら、環境への配慮や持続的な利用についても考慮したおもちゃの提案を目指します。</tspan></text>
